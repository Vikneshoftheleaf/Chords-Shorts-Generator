name: Generate music shorts

on:
  workflow_dispatch:
    inputs:
      count:
        description: Maximum number of new videos to generate
        required: true
        default: "1"
        type: string

permissions:
  contents: write

concurrency:
  group: music-shorts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dispatch branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install worker and tests
        run: python -m pip install -e ".[test]"
      - name: Test worker
        run: python -m pytest
      - name: Generate videos
        run: music-shorts --count "${{ inputs.count }}"
      - name: Commit and push generated files if changed
        shell: bash
        run: |
          mkdir -p outputs state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- outputs state
          if git diff --cached --quiet; then
            echo "No generated files or ledger changes to commit."
            exit 0
          fi
          git commit -m "Generate music shorts"
          git push origin "HEAD:${GITHUB_REF_NAME}"
