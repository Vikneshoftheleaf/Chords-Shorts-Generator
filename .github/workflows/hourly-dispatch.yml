name: Dispatch hourly music shorts generation

on:
  schedule:
    - cron: "5 * * * *"

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch generation workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run generate.yml --ref "$GITHUB_REF_NAME"
