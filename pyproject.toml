[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "music-shorts"
version = "0.1.0"
description = "Fixture-backed CLI for synthesizing short falling-note music videos"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "imageio-ffmpeg>=0.5,<1",
    "numpy>=1.26,<3",
    "Pillow>=10,<13",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
music-shorts = "music_shorts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
