[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "music-shorts"
version = "0.1.0"
description = "Generate narrated piano chord-progression Shorts with Piper TTS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "imageio-ffmpeg>=0.5,<1",
    "numpy>=1.26,<3",
    "Pillow>=10,<13",
    "piper-tts>=1.3,<2",
    "google-api-python-client>=2.100,<3",
    "google-auth-oauthlib>=1.2,<2",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
music-shorts = "music_shorts.cli:main"
music-shorts-publish = "music_shorts.youtube_publish:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
